<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Munich Event Picks</title>
  <meta name="description" content="Weekly picks of exhibitions, concerts, markets and more in and around Munich – in 繁中, English and Deutsch.">
  <meta name="theme-color" content="#1c1a19">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='14' width='7' height='15' rx='2' fill='%23d9773f'/%3E%3Cpath d='M5 14 Q8.5 4 12 14 Z' fill='%232f9467'/%3E%3Cline x1='8.5' y1='4' x2='8.5' y2='1.4' stroke='%232f9467' stroke-width='1.4' stroke-linecap='round'/%3E%3Cline x1='7.2' y1='2.4' x2='9.8' y2='2.4' stroke='%232f9467' stroke-width='1.4' stroke-linecap='round'/%3E%3Ccircle cx='8.5' cy='22' r='1.3' fill='%23f5dccb'/%3E%3Crect x='20' y='14' width='7' height='15' rx='2' fill='%23d9773f'/%3E%3Cpath d='M20 14 Q23.5 4 27 14 Z' fill='%232f9467'/%3E%3Cline x1='23.5' y1='4' x2='23.5' y2='1.4' stroke='%232f9467' stroke-width='1.4' stroke-linecap='round'/%3E%3Cline x1='22.2' y1='2.4' x2='24.8' y2='2.4' stroke='%232f9467' stroke-width='1.4' stroke-linecap='round'/%3E%3Ccircle cx='23.5' cy='22' r='1.3' fill='%23f5dccb'/%3E%3Cpath d='M16 9.5 l1 2.6 2.6 1 -2.6 1 -1 2.6 -1 -2.6 -2.6 -1 2.6 -1 Z' fill='%23cf3f7c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect x="5" y="14" width="7" height="15" rx="2" fill="var(--accent)"/>
          <path d="M5 14 Q8.5 4 12 14 Z" fill="var(--c-exhibition)"/>
          <line x1="8.5" y1="4" x2="8.5" y2="1.4" stroke="var(--c-exhibition)" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="7.2" y1="2.4" x2="9.8" y2="2.4" stroke="var(--c-exhibition)" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="8.5" cy="22" r="1.3" fill="var(--accent-soft)"/>
          <rect x="20" y="14" width="7" height="15" rx="2" fill="var(--accent)"/>
          <path d="M20 14 Q23.5 4 27 14 Z" fill="var(--c-exhibition)"/>
          <line x1="23.5" y1="4" x2="23.5" y2="1.4" stroke="var(--c-exhibition)" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="22.2" y1="2.4" x2="24.8" y2="2.4" stroke="var(--c-exhibition)" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="23.5" cy="22" r="1.3" fill="var(--accent-soft)"/>
          <path d="M16 9.5 l1 2.6 2.6 1 -2.6 1 -1 2.6 -1 -2.6 -2.6 -1 2.6 -1 Z" fill="var(--c-asia)"/>
        </svg>
        <span class="brand__name" data-i18n="siteTitle">慕尼黑活動精選</span>
      </div>
      <div class="langswitch" role="group" aria-label="Language">
        <button type="button" data-lang="zh-TW">
          <svg class="flag" viewBox="0 0 20 14" aria-hidden="true">
            <defs><clipPath id="flag-tw-clip"><rect width="20" height="14" rx="2"/></clipPath></defs>
            <g clip-path="url(#flag-tw-clip)">
              <rect width="20" height="14" fill="#fe0000"/>
              <rect width="10" height="7" fill="#000095"/>
              <circle cx="5" cy="3.5" r="1.9" fill="#fff"/>
              <circle cx="5" cy="3.5" r=".9" fill="#000095"/>
            </g>
          </svg>
          <span>繁中</span>
        </button>
        <button type="button" data-lang="en">
          <svg class="flag" viewBox="0 0 20 14" aria-hidden="true">
            <defs><clipPath id="flag-us-clip"><rect width="20" height="14" rx="2"/></clipPath></defs>
            <g clip-path="url(#flag-us-clip)">
              <rect width="20" height="14" fill="#fff"/>
              <rect y="0" width="20" height="1.08" fill="#b22234"/>
              <rect y="2.15" width="20" height="1.08" fill="#b22234"/>
              <rect y="4.31" width="20" height="1.08" fill="#b22234"/>
              <rect y="6.46" width="20" height="1.08" fill="#b22234"/>
              <rect y="8.62" width="20" height="1.08" fill="#b22234"/>
              <rect y="10.77" width="20" height="1.08" fill="#b22234"/>
              <rect y="12.92" width="20" height="1.08" fill="#b22234"/>
              <rect width="8" height="7.5" fill="#3c3b6e"/>
            </g>
          </svg>
          <span>EN</span>
        </button>
        <button type="button" data-lang="de">
          <svg class="flag" viewBox="0 0 20 14" aria-hidden="true">
            <defs><clipPath id="flag-de-clip"><rect width="20" height="14" rx="2"/></clipPath></defs>
            <g clip-path="url(#flag-de-clip)">
              <rect width="20" height="4.67" y="0" fill="#000"/>
              <rect width="20" height="4.67" y="4.67" fill="#dd0000"/>
              <rect width="20" height="4.66" y="9.34" fill="#ffce00"/>
            </g>
          </svg>
          <span>DE</span>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="intro">
      <p class="intro__tagline" data-i18n="tagline"></p>
      <p class="intro__meta" id="meta"></p>
    </section>

    <div class="toolbar">
      <div class="viewtabs" role="tablist">
        <button type="button" role="tab" data-view="list">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5.5h12M4 10h12M4 14.5h8"/></svg>
          <span data-i18n="listView">List view</span>
        </button>
        <button type="button" role="tab" data-view="calendar">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M3 8h14M7 2v4M13 2v4"/></svg>
          <span data-i18n="calendarView">Calendar view</span>
        </button>
      </div>
      <label class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
        <input type="search" id="q" autocomplete="off">
      </label>
    </div>

    <div class="filters">
      <div class="chips" id="chips"></div>
      <div class="filters__right">
        <select id="distance" aria-label="Distance"></select>
        <label class="toggle">
          <input type="checkbox" id="englishOnly">
          <span class="toggle__track" aria-hidden="true"></span>
          <span data-i18n="englishOnly"></span>
        </label>
      </div>
    </div>

    <div id="view"></div>

    <p class="disclaimer" data-i18n="disclaimer"></p>
  </main>

  <dialog id="detail" class="detail">
    <form method="dialog" class="detail__close"><button aria-label="Close">✕</button></form>
    <div id="detailBody"></div>
  </dialog>

  <script src="assets/app.js" type="module"></script>
</body>
</html>
